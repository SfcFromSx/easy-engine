# ==============================================================================
# Kylin JDBC Redis 缓存驱动 配置中心
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Redis 连接设置 (全局缓存后端)
# ------------------------------------------------------------------------------
redis.host=127.0.0.1
redis.port=6380
redis.password=
redis.db=0
# Redis 操作超时时间（毫秒），超时将自动降级为不使用缓存
redis.timeout_ms=500

# ------------------------------------------------------------------------------
# 2. 多数据源路由配置 (Multi-DataSource Registry)
# ------------------------------------------------------------------------------
#    private static final String JDBC_URL = "jdbc:kylin-cached://localhost:17070/learn_kylin";
# [关系说明]:
# - 默认情况下，驱动根据 JDBC URL (如 jdbc:kylin-cached://localhost:17070/project)
#   自动生成名为 "default" 的数据源。
# - 本文件中的 datasource.names 用于定义除此之外的 "扩展数据源"。

# 定义所有可用数据源逻辑名称（逗号分隔）
datasource.names=presto_local

# 默认不启用（此时忽略 SQL Hint，所有请求强制路由至 URL 定义的 default 数据源）
datasource.routing.enabled=true
cache.datasource.isolation.enabled=true

# --- 数据源 [default]: 本地 Kylin 容器 (默认) ---
datasource.default.type=kylin
datasource.default.driver_class=org.apache.kylin.jdbc.Driver
datasource.default.jdbc_url=jdbc:kylin://localhost:17070/learn_kylin
datasource.default.username=ADMIN
datasource.default.password=KYLIN

# --- 数据源 [presto_local]: 本地 Presto 容器 ---
datasource.presto_local.type=presto
datasource.presto_local.driver_class=com.facebook.presto.jdbc.PrestoDriver
# prestodb/presto 镜像内置 tpch/tpc（无 hive）；主机端口与 docker-compose 一致
datasource.presto_local.jdbc_url=jdbc:presto://localhost:18081/tpch/tiny
datasource.presto_local.username=admin

# ------------------------------------------------------------------------------
# 3. 缓存策略与安全设置
# ------------------------------------------------------------------------------
# 默认缓存过期时间（秒）
cache.ttl=300
# Redis 中的键前缀
cache.prefix=kylin_cache:
# 单个缓存对象最大允许的大小（字节），默认 2MB (2 * 1024 * 1024)
cache.max_size_bytes=2097152

# 启用后，会对高风险场景自动降级为不缓存
cache.safe_mode.enabled=false
# 是否启用带参数 SQL (PreparedStatement) 的缓存逻辑
cache.prepared_sql.enabled=true

# ------------------------------------------------------------------------------
# 4. 审计与追踪
# ------------------------------------------------------------------------------
# 启用后，每次执行结束会打印审计日志
sql.trace.enabled=false
# 是否同步将日志实时的异步推送到 Redis
sql.trace.redis.enabled=false
sql.trace.max_sql_length=512
