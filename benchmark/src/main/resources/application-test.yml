spring:
  application:
    name: benchmark
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    url: ${BENCHMARK_TEST_DB_JDBC_URL:jdbc:mysql://localhost:3307/engine_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${BENCHMARK_TEST_DB_USER:engine}
    password: ${BENCHMARK_TEST_DB_PASSWORD:engine123}
    driver-class-name: ${BENCHMARK_TEST_DB_DRIVER_CLASS:com.mysql.cj.jdbc.Driver}
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    table: benchmark_flyway_schema_history
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

server:
  port: ${SERVER_PORT:8091}

benchmark:
  jdbc:
    default-driver-class: org.apache.kylin.jdbc.Driver
    driver-dir: ${BENCHMARK_JDBC_DRIVER_DIR:${user.dir}/target/test-drivers/uploaded}
  preflight:
    kylin-auth-url: http://kylin/auth
    kylin-user: ADMIN
    kylin-password: KYLIN
    presto-info-url: http://presto/info

logging:
  level:
    com.smartbi.benchmark: INFO
