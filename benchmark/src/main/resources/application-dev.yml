spring:
  application:
    name: benchmark
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    url: ${BENCHMARK_DB_JDBC_URL:jdbc:mysql://localhost:3307/engine_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${BENCHMARK_DB_USER:engine}
    password: ${BENCHMARK_DB_PASSWORD:engine123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: false
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    table: benchmark_flyway_schema_history
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

server:
  port: ${SERVER_PORT:8091}

benchmark:
  jdbc:
    default-driver-class: org.apache.kylin.jdbc.Driver
    driver-dir: ./drivers
  preflight:
    kylin-auth-url: ${BENCHMARK_PREFLIGHT_KYLIN_AUTH_URL:http://127.0.0.1:17070/kylin/api/user/authentication}
    kylin-user: ${BENCHMARK_PREFLIGHT_KYLIN_USER:ADMIN}
    kylin-password: ${BENCHMARK_PREFLIGHT_KYLIN_PASSWORD:KYLIN}
    presto-info-url: ${BENCHMARK_PREFLIGHT_PRESTO_INFO_URL:http://127.0.0.1:18081/v1/info}

logging:
  level:
    com.smartbi.benchmark: INFO
