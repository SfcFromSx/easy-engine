spring:
  application:
    name: benchmark
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DB:engine_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:engine}
    password: ${MYSQL_PASSWORD:engine123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    table: benchmark_flyway_schema_history

server:
  port: ${SERVER_PORT:8091}

benchmark:
  jdbc:
    default-driver-class: org.apache.kylin.jdbc.Driver
    driver-dir: ./drivers
  # 管理端「环境预检」探测地址（页面调用 /api/v1/preflight）
  preflight:
    kylin-auth-url: http://127.0.0.1:17070/kylin/api/user/authentication
    kylin-user: ADMIN
    kylin-password: KYLIN
    presto-info-url: http://127.0.0.1:18081/v1/info

logging:
  level:
    com.smartbi.benchmark: INFO
