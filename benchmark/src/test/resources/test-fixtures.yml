      update:
        jdbc-url: "jdbc:mysql://localhost:3307/engine_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
        jdbc-user: "engine"
        jdbc-password: "engine123"
        driver-class: "com.mysql.cj.jdbc.Driver"
    smoke:
      test-datasource:
        name: "test_ds"
        type: "mysql"
        driver-class: "com.mysql.cj.jdbc.Driver"
        jdbc-url: "jdbc:mysql://localhost:3307/engine_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
        jdbc-user: "engine"
        jdbc-password: "engine123"
    jdbc-upload:
      test-datasource:
        name: "uploaded-driver"
        driver-class: "com.example.uploaded.UploadedMySqlDriver"
        jdbc-url: "jdbc:mysql://localhost:3307/engine_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
        jdbc-user: "engine"
        jdbc-password: "engine123"
    async-runner:
      target:
        driver-class: "com.mysql.cj.jdbc.Driver"
        jdbc-url: "jdbc:mysql://localhost:3307/engine_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
        jdbc-user: "engine"
        jdbc-password: "engine123"
    query-service:
      driver-class: "com.mysql.cj.jdbc.Driver"
      jdbc-url: "jdbc:mysql://localhost:3307/engine_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      jdbc-user: "engine"
      jdbc-password: "engine123"
    flyway-seed:
