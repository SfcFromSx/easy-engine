spring:
  application:
    name: manager
  datasource:
    url: ${MANAGER_TEST_DB_JDBC_URL:jdbc:h2:mem:managertest;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${MANAGER_TEST_DB_USER:sa}
    password: ${MANAGER_TEST_DB_PASSWORD:}
    driver-class-name: ${MANAGER_TEST_DB_DRIVER_CLASS:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
  flyway:
    enabled: false
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

server:
  port: ${SERVER_PORT:8090}

logging:
  level:
    com.smartbi.engine: INFO

manager:
  test:
    shared:
      driver-class-name: org.h2.Driver
      username: sa
      password:
      jdbc-options: MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    datasource-config-service:
      driver-class: com.mysql.jdbc.Driver
      jdbc-url: jdbc:mysql://example-host/test-db
      username: svc_user
      password:
    flyway:
      dashboard-db-name: managerdashboardbootstrap
      datasource-db-name: managerdatasourceflyway
      trace-db-name: managertraceflyway
      legacy-db-name: managerlegacyflyway
      baseline-v4-resource: db/manager-v4-baseline.sql
      legacy-v8-resource: db/manager-v8-legacy-flyway-baseline.sql
