spring:
  application:
    name: manager
  datasource:
    url: ${MANAGER_TEST_DB_JDBC_URL:jdbc:mysql://localhost:3307/engine_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${MANAGER_TEST_DB_USER:engine}
    password: ${MANAGER_TEST_DB_PASSWORD:engine123}
    driver-class-name: ${MANAGER_TEST_DB_DRIVER_CLASS:com.mysql.cj.jdbc.Driver}
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
  flyway:
    enabled: false
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

server:
  port: ${SERVER_PORT:8090}

logging:
  level:
    com.smartbi.engine: INFO

manager:
  test:
    shared:
      driver-class-name: org.h2.Driver
      username: sa
      password: ""
      jdbc-options: MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    datasource-config-service:
      driver-class: com.mysql.jdbc.Driver
      jdbc-url: jdbc:mysql://example-host/test-db
      username: svc_user
      password: ""
    datasource-lifecycle:
      default:
        name: default
        type: kylin
        driver-class: org.apache.kylin.jdbc.Driver
        jdbc-url: jdbc:kylin://localhost:17070/learn_kylin
        username: ADMIN
        password: KYLIN
      presto:
        name: presto_local
        type: presto
        driver-class: com.facebook.presto.jdbc.PrestoDriver
        jdbc-url: jdbc:presto://localhost:18081/tpch/tiny
        username: admin
        password: ""
        promoted-username: svc_presto
    flyway:
      dashboard-db-name: managerdashboardbootstrap
      datasource-db-name: managerdatasourceflyway
      trace-db-name: managertraceflyway
      legacy-db-name: managerlegacyflyway
      baseline-v4-resource: db/manager-v4-baseline.sql
      legacy-v8-resource: db/manager-v8-legacy-flyway-baseline.sql
