spring:
  application:
    name: manager
  datasource:
    url: ${MANAGER_TEST_DB_JDBC_URL:jdbc:mysql://localhost:3307/engine_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${MANAGER_TEST_DB_USER:engine}
    password: ${MANAGER_TEST_DB_PASSWORD:engine123}
    driver-class-name: ${MANAGER_TEST_DB_DRIVER_CLASS:com.mysql.cj.jdbc.Driver}
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
  flyway:
    enabled: false
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

server:
  port: ${SERVER_PORT:8090}

logging:
  level:
    com.smartbi.engine: INFO
