spring:
  datasource:
    url: "${QUERY_TEST_META_DB_JDBC_URL:jdbc:mysql://localhost:3307/engine_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}"
    username: "${QUERY_TEST_META_DB_USER:engine}"
    password: "${QUERY_TEST_META_DB_PASSWORD:engine123}"
    driver-class-name: "${QUERY_TEST_META_DB_DRIVER_CLASS:com.mysql.cj.jdbc.Driver}"

engine:
  query:
    manager-url: "${QUERY_TEST_MANAGER_URL:}"
    datasource:
      default:
        name: default
        type: "${QUERY_TEST_DEFAULT_TYPE:mysql}"
        driver-class: "${QUERY_TEST_DEFAULT_DRIVER_CLASS:com.mysql.cj.jdbc.Driver}"
        jdbc-url: "${QUERY_TEST_DEFAULT_JDBC_URL:jdbc:mysql://localhost:3307/engine_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}"
        username: "${QUERY_TEST_DEFAULT_JDBC_USER:engine}"
        password: "${QUERY_TEST_DEFAULT_JDBC_PASSWORD:engine123}"
        max-pool-size: 4
        min-idle: 1
        connection-timeout-ms: 10000
      named:
        presto_local:
          name: presto_local
          type: "${QUERY_TEST_PRESTO_TYPE:presto}"
          driver-class: "${QUERY_TEST_PRESTO_DRIVER_CLASS:com.mysql.cj.jdbc.Driver}"
          jdbc-url: "${QUERY_TEST_PRESTO_JDBC_URL:jdbc:mysql://localhost:3307/engine_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}"
          username: "${QUERY_TEST_PRESTO_JDBC_USER:engine}"
          password: "${QUERY_TEST_PRESTO_JDBC_PASSWORD:engine123}"
          max-pool-size: 4
          min-idle: 1
          connection-timeout-ms: 10000
        trino_local:
          name: trino_local
          type: "${QUERY_TEST_TRINO_TYPE:trino}"
          driver-class: "${QUERY_TEST_TRINO_DRIVER_CLASS:com.mysql.cj.jdbc.Driver}"
          jdbc-url: "${QUERY_TEST_TRINO_JDBC_URL:jdbc:mysql://localhost:3307/engine_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}"
          username: "${QUERY_TEST_TRINO_JDBC_USER:engine}"
          password: "${QUERY_TEST_TRINO_JDBC_PASSWORD:engine123}"
          max-pool-size: 4
          min-idle: 1
          connection-timeout-ms: 10000

query:
  test:
    manager-url: "http://localhost:8090"
    manager-response:
      default-jdbc-url: "jdbc:mysql://localhost:3307/engine_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      default-driver-class: "com.mysql.cj.jdbc.Driver"
    result-mapper:
      jdbc-url: "jdbc:mysql://localhost:3307/engine_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      jdbc-user: "engine"
      jdbc-password: "engine123"
    registry:
      shared:
        driver-class: "com.mysql.cj.jdbc.Driver"
        username: "engine"
        password: "engine123"
      default:
        name: default
        type: "mysql"
        driver-class: "com.mysql.cj.jdbc.Driver"
        jdbc-url: "jdbc:mysql://localhost:3307/engine_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
        username: "engine"
        password: "engine123"
      presto:
        name: presto_local
        type: "presto"
        driver-class: "com.mysql.cj.jdbc.Driver"
        jdbc-url: "jdbc:mysql://localhost:3307/engine_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
        username: "engine"
        password: "engine123"
      keyed:
        jdbc-url: "jdbc:mysql://localhost:3307/engine_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      manager:
        jdbc-url-prefix: "jdbc:mysql://localhost:3307/engine_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&name="
