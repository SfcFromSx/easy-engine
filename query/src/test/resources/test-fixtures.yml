spring:
  datasource:
    url: "${QUERY_TEST_META_DB_JDBC_URL:jdbc:h2:mem:querytestmeta;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}"
    username: "${QUERY_TEST_META_DB_USER:sa}"
    password: "${QUERY_TEST_META_DB_PASSWORD:}"
    driver-class-name: "${QUERY_TEST_META_DB_DRIVER_CLASS:org.h2.Driver}"

engine:
  query:
    manager-url: "${QUERY_TEST_MANAGER_URL:}"
    datasource:
      default:
        name: default
        type: "${QUERY_TEST_DEFAULT_TYPE:h2}"
        driver-class: "${QUERY_TEST_DEFAULT_DRIVER_CLASS:org.h2.Driver}"
        jdbc-url: "${QUERY_TEST_DEFAULT_JDBC_URL:jdbc:h2:mem:querytestdefault;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}"
        username: "${QUERY_TEST_DEFAULT_JDBC_USER:sa}"
        password: "${QUERY_TEST_DEFAULT_JDBC_PASSWORD:}"
        max-pool-size: 4
        min-idle: 1
        connection-timeout-ms: 10000
      named:
        presto_local:
          name: presto_local
          type: "${QUERY_TEST_PRESTO_TYPE:presto}"
          driver-class: "${QUERY_TEST_PRESTO_DRIVER_CLASS:org.h2.Driver}"
          jdbc-url: "${QUERY_TEST_PRESTO_JDBC_URL:jdbc:h2:mem:querytestpresto;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}"
          username: "${QUERY_TEST_PRESTO_JDBC_USER:sa}"
          password: "${QUERY_TEST_PRESTO_JDBC_PASSWORD:}"
          max-pool-size: 4
          min-idle: 1
          connection-timeout-ms: 10000
        trino_local:
          name: trino_local
          type: "${QUERY_TEST_TRINO_TYPE:trino}"
          driver-class: "${QUERY_TEST_TRINO_DRIVER_CLASS:org.h2.Driver}"
          jdbc-url: "${QUERY_TEST_TRINO_JDBC_URL:jdbc:h2:mem:querytesttrino;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}"
          username: "${QUERY_TEST_TRINO_JDBC_USER:sa}"
          password: "${QUERY_TEST_TRINO_JDBC_PASSWORD:}"
          max-pool-size: 4
          min-idle: 1
          connection-timeout-ms: 10000

query:
  test:
    manager-url: "http://localhost:8090"
    manager-response:
      default-jdbc-url: "jdbc:h2:mem:remote_default"
      default-driver-class: "org.h2.Driver"
    result-mapper:
      jdbc-url: "jdbc:h2:mem:result_mapper;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE"
      jdbc-user: "sa"
      jdbc-password: ""
    registry:
      shared:
        driver-class: "org.h2.Driver"
        username: "sa"
        password: ""
      default:
        name: default
        type: "h2"
        driver-class: "org.h2.Driver"
        jdbc-url: "jdbc:h2:mem:fallback_default"
        username: "sa"
        password: ""
      presto:
        name: presto_local
        type: "presto"
        driver-class: "org.h2.Driver"
        jdbc-url: "jdbc:h2:mem:fallback_presto"
        username: "sa"
        password: ""
      keyed:
        jdbc-url: "jdbc:h2:mem:keyed_named"
      manager:
        jdbc-url-prefix: "jdbc:h2:mem:"
