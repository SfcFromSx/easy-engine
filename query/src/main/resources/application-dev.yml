spring:
  application:
    name: query
  datasource:
    url: ${ENGINE_DB_JDBC_URL:jdbc:mysql://localhost:3307/engine_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${ENGINE_DB_USER:engine}
    password: ${ENGINE_DB_PASSWORD:engine123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6380}
    password: ${REDIS_PASSWORD:}

server:
  port: ${SERVER_PORT:8092}

engine:
  query:
    manager-url: ${ENGINE_QUERY_MANAGER_URL:http://localhost:8090}
    auth:
      username: ${ENGINE_QUERY_USER:ADMIN}
      password: ${ENGINE_QUERY_PASSWORD:KYLIN}
    cache:
      default-ttl-seconds: 300
      key-prefix: "kylin_cache:"
      max-cache-size-bytes: 2097152
      safe-mode-enabled: false
      prepared-sql-enabled: true
      datasource-isolation-enabled: true
    trace:
      enabled: true
    datasource:
      default:
        name: default
        type: kylin
        driver-class: org.apache.kylin.jdbc.Driver
        jdbc-url: jdbc:kylin://localhost:17070/learn_kylin
        username: ADMIN
        password: KYLIN
        max-pool-size: 4
        min-idle: 1
        connection-timeout-ms: 10000
      named:
        presto_local:
          name: presto_local
          type: presto
          driver-class: com.facebook.presto.jdbc.PrestoDriver
          jdbc-url: jdbc:presto://localhost:18081/tpch/tiny
          username: admin
          password:
          max-pool-size: 4
          min-idle: 1
          connection-timeout-ms: 10000
        trino_local:
          name: trino_local
          type: trino
          driver-class: io.trino.jdbc.TrinoDriver
          jdbc-url: jdbc:trino://localhost:8080/tpch/tiny
          username: admin
          password:
          max-pool-size: 4
          min-idle: 1
          connection-timeout-ms: 10000

logging:
  level:
    com.smartbi.query: INFO
